name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Ruff, Mypy, Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up stable Rust formatter
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustfmt --version

      - name: Install project
        run: uv sync --dev

      # tests/research serves the built workbench (webui/dist) and runs the
      # app's node tests, which import its packages.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: shinka/research/webui/app/pnpm-lock.yaml

      - name: Build the research workbench
        working-directory: shinka/research/webui/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Ruff
        run: uv run ruff check tests --exclude tests/file.py

      - name: Mypy
        run: uv run mypy --follow-imports=skip --ignore-missing-imports tests/test_*.py tests/conftest.py

      - name: Pytest + Coverage
        run: uv run --with pytest-cov pytest -q -m "not requires_secrets and not models_dev_live" --cov=shinka --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
