name: Research CI

on:
  push:
    branches: [main]
    paths:
      - "shinka/research/**"
      - "tests/research/**"
      - "examples/quant_research/**"
      - "skills/shinka-research/**"
      - "pyproject.toml"
      - ".github/workflows/research-ci.yml"
  pull_request:
    paths:
      - "shinka/research/**"
      - "tests/research/**"
      - "examples/quant_research/**"
      - "skills/shinka-research/**"
      - "pyproject.toml"
      - ".github/workflows/research-ci.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --dev
      # tests/research serves the built workbench (webui/dist) and runs the
      # app's node tests, which import its packages.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: shinka/research/webui/app/pnpm-lock.yaml
      - name: Build the workbench
        working-directory: shinka/research/webui/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Ruff
        run: |
          uv run ruff check shinka/research tests/research
          uv run ruff format --check shinka/research tests/research
      - name: Pytest
        run: uv run pytest -q tests/research
