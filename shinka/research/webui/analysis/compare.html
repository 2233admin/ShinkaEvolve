<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎏 Compare Results - ShinkaEvolve</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px 30px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
        }

        .header-text {
            flex: 1;
        }

        .header-text h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .header-text p {
            color: #666;
            font-size: 1rem;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            text-decoration: none;
            color: #555;
            font-size: 1rem;
            transition: all 0.15s;
        }

        .back-link:hover {
            border-color: #ccc;
            background: #fafafa;
            color: #333;
        }

        /* Charts row */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 1100px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
        }

        /* Chart container */
        .chart-container {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 25px;
        }

        .chart-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
        }

        /* Legend table */
        .legend-container {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
        }

        .legend-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .legend-table {
            width: 100%;
            border-collapse: collapse;
        }

        .legend-table th {
            text-align: left;
            padding: 10px 12px;
            font-weight: 500;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #666;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .legend-table th.numeric {
            text-align: right;
        }

        .legend-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .legend-table td.numeric {
            text-align: right;
            font-family: "SF Mono", Monaco, "Consolas", monospace;
            font-size: 0.95rem;
        }

        .legend-table tbody tr:last-child td {
            border-bottom: none;
        }

        .legend-table tbody tr {
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .legend-table tbody tr:hover {
            background: #f8f9fa;
        }

        .legend-table tbody tr:hover .result-label {
            color: #3498db;
        }

        .arrow-cell {
            color: #ccc;
            font-size: 1rem;
        }

        .legend-table tbody tr:hover .arrow-cell {
            color: #3498db;
        }

        .color-swatch {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .result-label {
            font-weight: 500;
            color: #2c3e50;
        }

        /* Loading state */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 75px;
            gap: 15px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #666;
            font-size: 1.125rem;
        }

        /* Error state */
        .error-state {
            padding: 50px 30px;
            text-align: center;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e74c3c;
        }

        .error-text {
            color: #666;
            font-size: 1rem;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9rem;
            color: #666;
        }

        .control-group select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            background: #fff;
        }

        /* Theme toggle */
        #theme-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid #e0e0e0; background: #fff;
            font-size: 18px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        #theme-toggle:hover { background: #f0f0f0; }

        /* ===== Dark Mode ===== */
        body.dark { background-color: #0D0D0D; color: #E8EAED; }
        body.dark .container { color: #E8EAED; }
        body.dark header { border-bottom-color: rgba(255,255,255,0.08); }
        body.dark .header-text h1 { color: #E8EAED; }
        body.dark .header-text p { color: #9AA0A6; }
        body.dark .back-link { background: #242424; color: #9AA0A6; border-color: rgba(255,255,255,0.08); }
        body.dark .back-link:hover { background: #333; color: #E8EAED; border-color: rgba(255,255,255,0.15); }
        body.dark .chart-container { background: #1A1A1A; border-color: rgba(255,255,255,0.08); }
        body.dark .chart-title { color: #E8EAED; }
        body.dark .legend-container { background: #1A1A1A; border-color: rgba(255,255,255,0.08); }
        body.dark .legend-title { color: #E8EAED; }
        body.dark .legend-table th { background: #242424; color: #9AA0A6; border-color: rgba(255,255,255,0.08); }
        body.dark .legend-table td { color: #E8EAED; border-color: rgba(255,255,255,0.06); }
        body.dark .legend-table tbody tr:hover { background: rgba(66,133,244,0.08); }
        body.dark .legend-table tbody tr:hover .result-label { color: #4285F4; }
        body.dark .result-label { color: #E8EAED; }
        body.dark .arrow-cell { color: #555; }
        body.dark .legend-table tbody tr:hover .arrow-cell { color: #4285F4; }
        body.dark .loading-container { background: #1A1A1A; border-color: rgba(255,255,255,0.08); }
        body.dark .spinner { border-color: #333; border-top-color: #4285F4; }
        body.dark .loading-text { color: #9AA0A6; }
        body.dark .error-state { background: #1A1A1A; border-color: rgba(255,255,255,0.08); }
        body.dark .error-text { color: #9AA0A6; }
        body.dark .control-group label { color: #9AA0A6; }
        body.dark .control-group select { background: #242424; color: #E8EAED; border-color: rgba(255,255,255,0.08); }
        body.dark #theme-toggle { background: #242424; border-color: rgba(255,255,255,0.08); }
        body.dark #theme-toggle:hover { background: #333; }
        body.dark ::-webkit-scrollbar-track { background: #0D0D0D; }
        body.dark ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        body.dark ::-webkit-scrollbar-thumb:hover { background: #8A60F5; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="favicon.png" alt="Shinka Logo" class="logo">
            <div class="header-text">
                <h1>运行比较</h1>
                <p id="subtitle">正在读取。</p>
            </div>
            <a href="/" class="back-link">← 返回全部运行</a>
        </header>

        <div id="loading-state" class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">正在读取比较数据。</div>
        </div>

        <div id="error-state" class="error-state" style="display: none;">
            <div class="error-icon">⚠️</div>
            <div class="error-title">没有可比较的运行：</div>
            <div class="error-text">请从全部运行选择至少两个运行。</div>
        </div>

        <div id="content" style="display: none;">
            <div class="controls">
                <div class="control-group">
                    <label for="metric-select">比较指标：</label>
                    <select id="metric-select" onchange="updateChart()">
                        <option value="best_score">最高有效得分</option>
                        <option value="program_count">程序总数</option>
                        <option value="correct_count">正确程序数</option>
                    </select>
                </div>
            </div>

            <div class="charts-row">
                <div class="chart-container">
                    <h2 class="chart-title" id="chart-title-gen">最高有效得分 · 代数</h2>
                    <div class="chart-wrapper">
                        <canvas id="chart-generations"></canvas>
                    </div>
                </div>
                <div class="chart-container">
                    <h2 class="chart-title" id="chart-title-cost">最高有效得分 · 累计费用</h2>
                    <div class="chart-wrapper">
                        <canvas id="chart-cost"></canvas>
                    </div>
                </div>
            </div>

            <div class="legend-container">
                <h3 class="legend-title">已选运行</h3>
                <table class="legend-table">
                    <thead>
                        <tr>
                            <th>运行</th>
                            <th class="numeric">最高有效得分</th>
                            <th class="numeric">最大代数</th>
                            <th class="numeric">程序</th>
                            <th class="numeric">费用 ($)</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="legend-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Chart.js instances
        let chartGen = null;
        let chartCost = null;
        
        // Store fetched data
        let resultsData = {};
        let selection = [];

        // Neutral shared tokens plus line patterns distinguish runs without
        // assigning success/failure meanings to categorical series.
        const SERIES = ['ink', 'muted', 'line-strong'];

        async function init() {
            // Each comparison owns its selection, including native Back/Forward.
            const stored = new URLSearchParams(window.location.search).get('selection');
            if (!stored) {
                showError();
                return;
            }

            try {
                selection = JSON.parse(stored);
            } catch (e) {
                showError();
                return;
            }

            if (!selection || selection.length < 2) {
                showError();
                return;
            }

            document.getElementById('subtitle').textContent = `正在比较 ${selection.length} 个运行；点击运行行可进入完整分析。`;

            // Fetch data for all selected databases in parallel
            try {
                await Promise.all(selection.map(s => fetchResultData(s)));
                showContent();
                updateChart();
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('error-state').querySelector('.error-title').textContent = '读取失败：';
                document.getElementById('error-state').querySelector('.error-text').textContent = error.message;
                showError();
            }
        }

        async function fetchResultData(item) {
            const query = `db_path=${encodeURIComponent(item.path)}`;
            const [programsResponse, statsResponse] = await Promise.all([
                fetch(`/get_programs_summary?${query}`),
                fetch(`/get_database_stats?${query}`),
            ]);
            if (!programsResponse.ok || !statsResponse.ok) {
                throw new Error(`Failed to fetch data for ${item.label}`);
            }
            const programs = await programsResponse.json();
            const stats = await statsResponse.json();
            // Prompt evolution is part of every total (OD-9); its charges sit in prompts.sqlite.
            let prompts = [];
            if (stats.has_prompt_evo) {
                const promptsResponse = await fetch(`/get_system_prompts?${query}`);
                if (!promptsResponse.ok) {
                    throw new Error(`Failed to fetch data for ${item.label}`);
                }
                prompts = await promptsResponse.json();
            }
            resultsData[item.path] = {
                label: item.label,
                programs: programs,
                stats: stats,
                prompts: prompts
            };
        }

        function showError() {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
            document.getElementById('content').style.display = 'none';
        }

        function showContent() {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            populateLegend();
        }

        function populateLegend() {
            const tbody = document.getElementById('legend-body');
            tbody.innerHTML = '';

            selection.forEach((item, idx) => {
                const data = resultsData[item.path];
                const color = `var(--${SERIES[idx % SERIES.length]})`;
                
                // Calculate stats
                const programs = data.programs || [];
                const maxGen = programs.reduce((max, p) => Math.max(max, p.generation || 0), 0);
                const scores = programs.filter(p => p.correct && Number.isFinite(p.combined_score)).map(p => p.combined_score);
                const bestScore = scores.length ? Math.max(...scores) : null;
                // The run statistics carry the run's total under one rule: programs plus prompt evolution.
                const stats = data.stats || {};
                const totalCost = Number.isFinite(stats.total_cost) && Number.isFinite(stats.prompt_evo_cost)
                    ? stats.total_cost + stats.prompt_evo_cost : null;
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <span class="color-swatch" style="background: ${color}"></span>
                        <button type="button" class="program-link result-label">${escapeHtml(item.label)}</button>
                    </td>
                    <td class="numeric">${bestScore === null ? '—' : bestScore.toFixed(2)}</td>
                    <td class="numeric">${maxGen}</td>
                    <td class="numeric">${programs.length.toLocaleString()}</td>
                    <td class="numeric">${totalCost === null ? '—' : totalCost.toFixed(2)}</td>
                    <td class="arrow-cell">→</td>
                `;
                
                // Make row clickable
                row.addEventListener('click', () => {
                    window.location.href = `/viz_tree.html?db_path=${encodeURIComponent(item.path)}`;
                });
                
                tbody.appendChild(row);
            });
        }

        // Costs follow rundb.run_cost, the rule of the run list and the budget: an absent or null field is a
        // recorded zero (the runner writes a field only for the steps that ran), a present value must be an
        // amount, island copies repeat their source's metadata and are not charges, and an unpriced headless
        // call has no known API cost.
        function recordedCost(value) {
            return value === undefined || value === null ? 0 : Number.isFinite(value) && value >= 0 ? value : null;
        }
        function getProgramCost(p) {
            const md = p.metadata || {};
            if (md._is_island_copy || md._spawned_island) return 0;
            const model = String(md.model_name || md.model || md.llm_result?.model_name || md.llm_result?.model || '');
            if (model.startsWith('headless/') && (md.headless_pricing_unknown === true || md.headless_pricing_unknown === 1)) return null;
            const values = ['api_costs', 'embed_cost', 'novelty_cost', 'meta_cost'].map(key => recordedCost(md[key]));
            return values.includes(null) ? null : values.reduce((sum, value) => sum + value, 0);
        }

        function updateChart() {
            const metric = document.getElementById('metric-select').value;
            
            const metricLabels = {
                'best_score': '最高有效得分',
                'program_count': '程序总数',
                'correct_count': '正确程序数'
            };
            const metricLabel = metricLabels[metric] || '数值';
            
            document.getElementById('chart-title-gen').textContent = `${metricLabel} · 代数`;
            document.getElementById('chart-title-cost').textContent = `${metricLabel} · 累计费用 ($)`;

            // Build datasets for both charts
            const datasetsGen = [];
            const datasetsCost = [];
            
            selection.forEach((item, idx) => {
                const data = resultsData[item.path];
                const series = idx;
                const programs = data.programs || [];
                
                // Sort programs by generation for the generation chart
                const sortedByGen = [...programs].sort((a, b) => (a.generation || 0) - (b.generation || 0));
                
                // === Chart 1: By Generation ===
                const genData = {};
                sortedByGen.forEach(p => {
                    const gen = p.generation || 0;
                    if (!genData[gen]) {
                        genData[gen] = { programs: [], scores: [] };
                    }
                    genData[gen].programs.push(p);
                    if (p.correct && Number.isFinite(p.combined_score)) {
                        genData[gen].scores.push(p.combined_score);
                    }
                });

                const generations = Object.keys(genData).map(Number).sort((a, b) => a - b);
                let cumulativeBest = null;
                let cumulativePrograms = 0;
                let cumulativeCorrect = 0;
                
                const pointsGen = generations.map(gen => {
                    const genInfo = genData[gen];
                    if (genInfo.scores.length) {
                        const genBest = Math.max(...genInfo.scores);
                        cumulativeBest = cumulativeBest === null ? genBest : Math.max(cumulativeBest, genBest);
                    }
                    cumulativePrograms += genInfo.programs.length;
                    cumulativeCorrect += genInfo.programs.filter(p => p.correct).length;
                    
                    let value;
                    switch (metric) {
                        case 'best_score': value = cumulativeBest; break;
                        case 'program_count': value = cumulativePrograms; break;
                        case 'correct_count': value = cumulativeCorrect; break;
                        default: value = cumulativeBest;
                    }
                    return { x: gen, y: value };
                });

                datasetsGen.push({
                    label: item.label,
                    data: pointsGen,
                    researchSeries: series,
                    borderWidth: 2,
                    pointRadius: 2,
                    pointHoverRadius: 4,
                    tension: 0.1,
                    fill: false
                });

                // === Chart 2: By Cost ===
                // Programs and prompt versions charge in timestamp order, so the curve ends at the run's total.
                const charges = [
                    ...programs.map(p => ({ time: p.timestamp || 0, cost: getProgramCost(p), program: p })),
                    ...(data.prompts || []).map(prompt => ({ time: prompt.timestamp || 0, cost: recordedCost(prompt.metadata?.llm?.cost), program: null })),
                ].sort((a, b) => a.time - b.time);
                let runningCost = 0;
                let runningBest = null;
                let runningPrograms = 0;
                let runningCorrect = 0;
                let value = null;

                const pointsCost = [];
                charges.forEach(({ cost, program: p }) => {
                    runningCost = runningCost === null || cost === null ? null : runningCost + cost;
                    if (!p) return;
                    runningPrograms += 1;
                    if (p.correct) runningCorrect += 1;
                    if (p.correct && Number.isFinite(p.combined_score)) {
                        runningBest = runningBest === null ? p.combined_score : Math.max(runningBest, p.combined_score);
                    }

                    switch (metric) {
                        case 'best_score': value = runningBest; break;
                        case 'program_count': value = runningPrograms; break;
                        case 'correct_count': value = runningCorrect; break;
                        default: value = runningBest;
                    }
                    pointsCost.push({ x: runningCost, y: value });
                });
                // A prompt charged after the last program still moves the curve's end to the run's total.
                if (pointsCost.length && pointsCost[pointsCost.length - 1].x !== runningCost) {
                    pointsCost.push({ x: runningCost, y: value });
                }

                // Downsample if too many points (for performance)
                const maxPoints = 200;
                let sampledPoints = pointsCost;
                if (pointsCost.length > maxPoints) {
                    const step = Math.ceil(pointsCost.length / maxPoints);
                    sampledPoints = pointsCost.filter((_, i) => i % step === 0 || i === pointsCost.length - 1);
                }

                datasetsCost.push({
                    label: item.label,
                    data: sampledPoints,
                    researchSeries: series,
                    borderWidth: 2,
                    pointRadius: 1,
                    pointHoverRadius: 3,
                    tension: 0.1,
                    fill: false
                });
            });

            // Create/update Generation chart
            const ctxGen = document.getElementById('chart-generations').getContext('2d');
            if (chartGen) chartGen.destroy();
            
            chartGen = new Chart(ctxGen, {
                type: 'line',
                data: { datasets: datasetsGen },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, padding: 15, boxWidth: 8 } },
                        tooltip: {
                            callbacks: {
                                label: ctx => {
                                    let v = ctx.parsed.y;
                                    if (metric === 'best_score') v = v.toFixed(2);
                                    return `${ctx.dataset.label}: ${v}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { type: 'linear', title: { display: true, text: 'Generation' }, grid: { color: '#f0f0f0' } },
                        y: { title: { display: true, text: metricLabel }, grid: { color: '#f0f0f0' }, beginAtZero: metric !== 'best_score' }
                    }
                }
            });

            // Create/update Cost chart
            const ctxCost = document.getElementById('chart-cost').getContext('2d');
            if (chartCost) chartCost.destroy();
            
            chartCost = new Chart(ctxCost, {
                type: 'line',
                data: { datasets: datasetsCost },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, padding: 15, boxWidth: 8 } },
                        tooltip: {
                            callbacks: {
                                label: ctx => {
                                    let v = ctx.parsed.y;
                                    if (metric === 'best_score') v = v.toFixed(2);
                                    return `${ctx.dataset.label}: ${v}`;
                                },
                                title: ctx => `Cost: $${ctx[0].parsed.x.toFixed(2)}`
                            }
                        }
                    },
                    scales: {
                        x: { type: 'linear', title: { display: true, text: 'API Cost ($)' }, grid: { color: '#f0f0f0' } },
                        y: { title: { display: true, text: metricLabel }, grid: { color: '#f0f0f0' }, beginAtZero: metric !== 'best_score' }
                    }
                }
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replaceAll('"', '&quot;').replaceAll("'", '&#39;');
        }


        // Initialize on page load
        init();
    </script>
</body>
</html>
