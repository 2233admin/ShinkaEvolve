<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ ShinkaEvolve Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Google Sans & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        :root {
            /* Gemini Official Palette */
            --gemini-bg: #0D0D0D;
            --gemini-surface: #1A1A1A;
            --gemini-surface-bright: #242424;
            --gemini-blue: #4285F4;
            --gemini-purple: #8A60F5;
            --gemini-gradient: linear-gradient(135deg, #4285F4 0%, #8A60F5 100%);
            --gemini-gradient-soft: linear-gradient(135deg, rgba(66, 133, 244, 0.1) 0%, rgba(138, 96, 245, 0.1) 100%);
            --gemini-text-primary: #FFFFFF;
            --gemini-text-secondary: #BDBDBD;
            --gemini-border: rgba(255, 255, 255, 0.08);
            
            /* Elevation & Blur */
            --glass-bg: rgba(26, 26, 26, 0.7);
            --glass-blur: blur(12px);
            
            /* Motion */
            --easing: cubic-bezier(0.4, 0, 0.2, 1);
            --transition: all 0.3s var(--easing);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Google Sans', sans-serif;
            background-color: var(--gemini-bg);
            color: var(--gemini-text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Scrollbar Styling --- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gemini-surface-bright); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gemini-purple); }

        /* --- Layout --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--gemini-border);
            padding: 12px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(138, 96, 245, 0.3);
        }

        .brand-name {
            font-family: 'Google Sans', sans-serif;
            font-size: 1.25rem;
            font-weight: 500;
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .sparkle-icon {
            font-size: 18px;
            color: var(--gemini-purple);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 32px 64px;
        }

        /* --- Stats Overview --- */
        #stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background-color: var(--gemini-surface);
            border: 1px solid var(--gemini-border);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(138, 96, 245, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(138, 96, 245, 0.1);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--gemini-gradient);
            opacity: 0;
            transition: var(--transition);
        }

        .stat-card:hover::before { opacity: 1; }

        .stat-label {
            font-size: 0.75rem;
            color: var(--gemini-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: block;
        }

        .stat-value {
            font-family: 'Google Sans', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gemini-text-primary);
        }

        /* --- Search & Controls --- */
        .action-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-container .material-symbols-outlined {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gemini-text-secondary);
        }

        #search-input {
            width: 100%;
            background-color: var(--gemini-surface);
            border: 1px solid var(--gemini-border);
            border-radius: 999px;
            padding: 14px 16px 14px 52px;
            color: var(--gemini-text-primary);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        #search-input:focus {
            outline: none;
            border-color: var(--gemini-purple);
            background-color: var(--gemini-surface-bright);
            box-shadow: 0 0 0 4px rgba(138, 96, 245, 0.15);
        }

        /* --- Buttons --- */
        .btn-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 999px;
            font-family: 'Google Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gemini-gradient);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(138, 96, 245, 0.5);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--gemini-border);
            color: var(--gemini-text-primary);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--gemini-text-secondary);
        }

        .compare-btn {
            display: none;
        }
        .compare-btn.visible {
            display: flex;
        }

        .count-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        /* --- Table Section --- */
        .table-section {
            background-color: var(--gemini-surface);
            border-radius: 24px;
            border: 1px solid var(--gemini-border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--gemini-text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--gemini-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
        }

        tbody tr {
            transition: var(--transition);
            cursor: pointer;
        }

        tbody tr:hover {
            background-color: rgba(138, 96, 245, 0.04);
        }

        tbody tr.selected {
            background-color: rgba(138, 96, 245, 0.08);
            box-shadow: inset 4px 0 0 var(--gemini-purple);
        }

        .numeric {
            font-family: 'Roboto Mono', monospace;
            text-align: right;
        }

        /* --- Task Group Styling --- */
        .task-group-header {
            background: linear-gradient(90deg, rgba(138, 96, 245, 0.05) 0%, transparent 100%);
            cursor: pointer;
        }

        .task-group-header td {
            font-family: 'Google Sans', sans-serif;
            font-weight: 500;
            color: var(--gemini-purple);
            padding: 18px 16px;
        }

        .task-toggle {
            display: inline-block;
            transition: transform 0.3s var(--easing);
            margin-right: 12px;
        }

        .collapsed .task-toggle {
            transform: rotate(-90deg);
        }

        .task-count-pill {
            background-color: rgba(138, 96, 245, 0.15);
            color: var(--gemini-purple);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 12px;
        }

        /* --- Visual Elements --- */
        .chip {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gemini-border);
        }

        .pe-active {
            background: var(--gemini-gradient);
            border: none;
            color: white;
            box-shadow: 0 4px 10px rgba(138, 96, 245, 0.3);
        }

        .score-gradient {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .progress-bar-container {
            width: 80px;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            display: inline-block;
            margin-top: 4px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--gemini-gradient);
            border-radius: 3px;
            transition: width 1s var(--easing);
        }

        /* --- Loading states --- */
        .loading-container {
            padding: 100px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .gemini-spinner {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0%, #4285F4 25%, #8A60F5 50%, #4285F4 75%, transparent 100%);
            mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 0);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 0);
            animation: spin 1.5s infinite linear;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .hidden { display: none !important; }

        /* --- Responsive Adjustments --- */
        @media (max-width: 1000px) {
            .hide-tablet { display: none; }
        }
        @media (max-width: 600px) {
            .hide-mobile { display: none; }
            .action-row { flex-direction: column; align-items: stretch; }
            header { padding: 12px 16px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="favicon.png" alt="Shinka" class="logo">
            <span class="brand-name">ShinkaEvolve</span>
            <span class="material-symbols-outlined sparkle-icon">sparkles</span>
        </div>
        
        <div class="nav-links" style="display:flex;align-items:center;gap:12px;">
            <button id="live-indicator" type="button" aria-pressed="true" title="每 10 秒刷新运行记录" onclick="toggleAutoRefresh()">
                <span id="live-label">自动刷新：开</span>
            </button>
            <a href="https://github.com/SakanaAI/ShinkaEvolve" target="_blank" class="btn-pill btn-secondary" title="GitHub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                <span class="hide-mobile">GitHub</span>
            </a>
        </div>
    </header>

    <main class="container">
        <!-- Stats Summary -->
        <section id="stats-overview">
            <div class="stat-card">
                <span class="stat-label">运行</span>
                <span class="stat-value" id="global-exp-count">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">最高得分</span>
                <span class="stat-value" id="global-peak-score">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">累计费用</span>
                <span class="stat-value" id="global-total-cost">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">程序总数</span>
                <span class="stat-value" id="global-total-programs">—</span>
            </div>
        </section>

        <!-- Search & Actions -->
        <div class="action-row">
            <div class="search-container">
                <span class="material-symbols-outlined">search</span>
                <input type="search" id="search-input" aria-label="检索任务与运行" placeholder="检索任务、运行或设置…">
            </div>
            <label class="sort-control">排序
                <select id="sort-runs" onchange="renderTable()">
                    <option value="name">任务名称</option><option value="score">最高得分</option>
                    <option value="updated">最近更新</option><option value="cost">累计费用</option>
                </select>
            </label>
            
            <button id="compare-btn" class="btn-pill btn-primary compare-btn" onclick="openCompare()" disabled>
                <span class="material-symbols-outlined">compare_arrows</span>
                比较所选运行
                <span id="compare-count" class="count-badge">0</span>
            </button>
        </div>

        <!-- Main Table Section -->
        <section class="table-section">
            <div id="loading-state" class="loading-container">
                <div class="gemini-spinner"></div>
                <div>正在读取运行记录…</div>
            </div>

            <div id="empty-state" class="loading-container hidden">
                <span class="material-symbols-outlined" style="font-size: 48px; color: var(--gemini-purple);">database_off</span>
                <h3>没有可显示的运行</h3>
                <p>请检查检索条件与启动服务时指定的运行目录。</p>
            </div>

            <div id="table-wrapper" class="hidden">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th width="48" aria-label="选择运行"></th>
                            <th>任务</th><th>运行目录</th>
                            <th class="numeric">程序数</th><th class="numeric">有效程序</th>
                            <th class="numeric">最大代数</th><th class="numeric">停滞代数</th>
                            <th class="numeric">最高得分</th><th class="numeric">提示词</th>
                            <th class="numeric">费用 ($)</th><th>更新时间</th>
                            <th width="48" aria-label="打开分析"></th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        let allDatabases = [];
        let tasksAndResults = {};
        const statsCache = {};
        const pendingStats = new Set();
        const selectedRuns = new Map();
        const saved = new URLSearchParams(location.search);
        try {
            const items = JSON.parse(saved.get('selected') || '[]');
            if (Array.isArray(items)) for (const item of items) {
                if (typeof item?.path === 'string' && typeof item?.label === 'string') selectedRuns.set(item.path, item);
            }
        } catch { /* An invalid selection is recoverable from the run list. */ }
        document.getElementById('search-input').value = saved.get('q') || '';
        const sortControl = document.getElementById('sort-runs');
        if ([...sortControl.options].some(option => option.value === saved.get('sort'))) sortControl.value = saved.get('sort');

        async function loadDatabases() {
            try {
                const response = await fetch('/list_databases');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const dbs = await response.json();
                allDatabases = dbs;
                const available = new Set(dbs.map(db => db.path));
                for (const path of selectedRuns.keys()) if (!available.has(path)) selectedRuns.delete(path);
                for (const path of Object.keys(statsCache)) if (!available.has(path)) delete statsCache[path];
                organizeDatabases(dbs);
                renderTable(document.getElementById('search-input').value);
                
                // Aggressive fetch for visible stats
                setTimeout(() => loadVisibleStats(true), 50);
            } catch (error) {
                console.error("Discovery error:", error);
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                document.querySelector('#empty-state h3').textContent = '无法读取运行目录';
                document.querySelector('#empty-state p').textContent = `${error.message || '服务不可达'}。请检查服务后刷新页面。`;
            }
        }

        function organizeDatabases(dbs) {
            tasksAndResults = {};
            dbs.forEach(db => {
                const task = db.task || 'Unclassified';
                if (!tasksAndResults[task]) tasksAndResults[task] = [];
                tasksAndResults[task].push({
                    name: db.name || db.path,
                    path: db.path,
                    actualPath: db.actual_path || db.path
                });
            });
        }

        function renderTable(filter = document.getElementById('search-input').value) {
            const loadingState = document.getElementById('loading-state');
            const emptyState = document.getElementById('empty-state');
            const tableWrapper = document.getElementById('table-wrapper');
            const tbody = document.getElementById('results-body');
            updateCompareButton();
            const selected = new Set(selectedRuns.keys());
            const sortKey = { score: 'best_score', updated: 'last_update', cost: 'total_cost' }[document.getElementById('sort-runs').value];
            function rank(run) {
                const stats = statsCache[run.path];
                const value = sortKey === 'total_cost' && stats ? totalRecordedCost(stats) : stats?.[sortKey];
                return Number.isFinite(value) ? value : -Infinity;
            }
            function order(a, b) { return (sortKey ? rank(b) - rank(a) : 0) || a.name.localeCompare(b.name); }

            loadingState.classList.add('hidden');
            
            const tasks = Object.keys(tasksAndResults).sort((a, b) => {
                const first = [...tasksAndResults[a]].sort(order)[0];
                const second = [...tasksAndResults[b]].sort(order)[0];
                return order(first, second);
            });
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                tableWrapper.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tableWrapper.classList.remove('hidden');
            tbody.innerHTML = '';

            const filterLower = filter.toLowerCase();

            tasks.forEach(task => {
                const results = tasksAndResults[task];
                const filteredResults = results.filter(r => 
                    !filter || task.toLowerCase().includes(filterLower) || r.name.toLowerCase().includes(filterLower)
                );

                if (filteredResults.length === 0) return;

                filteredResults.sort(order);

                // Group Header
                const taskId = 'task-' + encodeURIComponent(task);
                const headerRow = document.createElement('tr');
                headerRow.className = 'task-group-header';
                const isCollapsed = localStorage.getItem('collapsed-' + taskId) === 'true';
                if (isCollapsed) headerRow.classList.add('collapsed');

                headerRow.innerHTML = `
                    <td colspan="12">
                        <button type="button" class="task-expander" aria-expanded="${!isCollapsed}">
                            <span class="task-toggle" aria-hidden="true">▼</span>
                            ${escapeHtml(task)}
                            <span class="task-count-pill">${filteredResults.length} 个运行</span>
                        </button>
                    </td>
                `;
                
                headerRow.onclick = () => {
                    toggleTaskGroup(headerRow, taskId);
                    headerRow.querySelector('button').setAttribute('aria-expanded', String(!headerRow.classList.contains('collapsed')));
                    loadVisibleStats();
                };
                tbody.appendChild(headerRow);

                filteredResults.forEach(result => {
                    const cached = statsCache[result.path];

                    const row = document.createElement('tr');
                    row.className = 'task-child' + (isCollapsed ? ' hidden' : '');
                    row.dataset.dbPath = result.path;
                    row.dataset.taskId = taskId;



                    row.innerHTML = `
                        <td onclick="event.stopPropagation()">
                            <input type="checkbox" class="result-checkbox" aria-label="选择运行 ${escapeHtml(result.name)}" data-path="${escapeHtml(result.path)}" data-label="${escapeHtml(result.name)}" ${selected.has(result.path) ? 'checked' : ''} onchange="updateCompareButton()">
                        </td>
                        <td style="color: var(--gemini-text-secondary)">${escapeHtml(task)}</td>
                        <td><a href="/viz_tree.html?db_path=${encodeURIComponent(result.path)}">${escapeHtml(result.name)}</a></td>
                        <td class="numeric hide-tablet" data-stat="program_count">${renderLoader(cached, 'program_count')}</td>
                        <td class="numeric hide-tablet" data-stat="correct_count">${renderLoader(cached, 'correct_count')}</td>
                        <td class="numeric" data-stat="max_generation">${renderLoader(cached, 'max_generation')}</td>
                        <td class="numeric hide-tablet" data-stat="stall">${renderLoader(cached, 'gens_since_improvement', formatStall)}</td>
                        <td class="numeric" data-stat="best_score">${renderLoader(cached, 'best_score', formatScore)}</td>
                        <td class="numeric hide-tablet" data-stat="prompt_evo">${renderLoader(cached, 'has_prompt_evo', (_, s) => formatPromptEvo(s))}</td>
                        <td class="numeric hide-mobile" data-stat="total_cost">${renderLoader(cached, 'total_cost', (_, stats) => formatCost(totalRecordedCost(stats)))}</td>
                        <td class="hide-mobile" data-stat="last_update">${renderLoader(cached, 'last_update', formatTimeAgo)}</td>
                        <td class="numeric"><span class="material-symbols-outlined" style="font-size:18px; opacity:0.5">chevron_right</span></td>
                    `;

                    row.onclick = () => window.location.href = `/viz_tree.html?db_path=${encodeURIComponent(result.path)}`;
                    tbody.appendChild(row);
                });
            });
            if (!tbody.children.length) {
                emptyState.classList.remove('hidden');
                tableWrapper.classList.add('hidden');
                document.querySelector('#empty-state h3').textContent = '没有匹配的运行';
                document.querySelector('#empty-state p').textContent = '请修改或清除检索条件；已选运行仍会保留。';
            }
            updateCompareButton();
        }

        function renderLoader(cached, key, formatter = (v) => v?.toLocaleString() || '-') {
            if (!cached) return '<div class="gemini-spinner" style="width:14px; height:14px; mask-size: 2px;"></div>';
            return formatter(cached[key], cached);
        }

        async function loadVisibleStats(force = false) {
            const rows = new Map([...document.querySelectorAll('tr[data-db-path]')].map(row => [row.dataset.dbPath, row]));
            const batchSize = 4;
            for (let i = 0; i < allDatabases.length; i += batchSize) {
                const batch = allDatabases.slice(i, i + batchSize);
                await Promise.all(batch.map(db => loadStatsForRow(rows.get(db.path), force, db.path)));
            }
            updateGlobalStats();
            if (document.getElementById('sort-runs').value !== 'name') renderTable();
        }

        async function loadStatsForRow(row, force, dbPath) {
            if ((!force && statsCache[dbPath]) || pendingStats.has(dbPath)) return;

            pendingStats.add(dbPath);
            try {
                const response = await fetch(`/get_database_stats?db_path=${encodeURIComponent(dbPath)}`);
                if (response.ok) {
                    const stats = await response.json();
                    statsCache[dbPath] = stats;
                    if (row) updateRowStats(row, stats);
                } else {
                    statsCache[dbPath] = { error: true };
                    if (row) row.querySelector('[data-stat="program_count"]').textContent = '读取失败';
                }
            } catch (e) {
                console.error("Stats fetch failed", e);
                statsCache[dbPath] = { error: true };
                if (row) row.querySelector('[data-stat="program_count"]').textContent = '读取失败';
            } finally {
                pendingStats.delete(dbPath);
            }
        }

        function totalRecordedCost(stats) {
            return Number.isFinite(stats.total_cost) && Number.isFinite(stats.prompt_evo_cost)
                ? stats.total_cost + stats.prompt_evo_cost : null;
        }

        function updateRowStats(row, stats) {

            const totalCost = totalRecordedCost(stats);
            const mapping = {
                'program_count': stats.program_count.toLocaleString(),
                'correct_count': stats.correct_count.toLocaleString(),
                'max_generation': stats.max_generation || 0,
                'stall': formatStall(stats.gens_since_improvement),
                'best_score': formatScore(stats.best_score),
                'prompt_evo': formatPromptEvo(stats),
                'total_cost': formatCost(totalCost),
                'last_update': formatTimeAgo(stats.last_update),
                'total_runtime_seconds': formatDuration(stats.total_runtime_seconds)
            };

            for (const [stat, val] of Object.entries(mapping)) {
                const cell = row.querySelector(`[data-stat="${stat}"]`);
                if (cell) cell.innerHTML = val;
            }
        }

        function updateGlobalStats() {
            const activeStats = Object.values(statsCache).filter(stats => !stats.error);
            const validScores = activeStats.map(s => s.best_score).filter(Number.isFinite);
            const totalCost = activeStats.reduce((a, b) => a + (b.total_cost || 0) + (b.prompt_evo_cost || 0), 0);
            const totalPrograms = activeStats.reduce((a, b) => a + b.program_count, 0);
            const costsKnown = activeStats.every(s => Number.isFinite(s.total_cost) && Number.isFinite(s.prompt_evo_cost));

            document.getElementById('global-exp-count').textContent = allDatabases.length;
            document.getElementById('global-peak-score').textContent = validScores.length ? Math.max(...validScores).toFixed(2) : '—';
            document.getElementById('global-total-cost').textContent = activeStats.length === allDatabases.length && costsKnown ? `$${totalCost.toFixed(2)}` : '—';
            document.getElementById('global-total-programs').textContent = activeStats.length === allDatabases.length ? totalPrograms.toLocaleString() : '—';
        }

        function toggleTaskGroup(headerRow, taskId) {
            const isCollapsed = headerRow.classList.toggle('collapsed');
            localStorage.setItem('collapsed-' + taskId, isCollapsed);
            const childRows = document.querySelectorAll(`tr.task-child[data-task-id="${taskId}"]`);
            childRows.forEach(row => {
                if (isCollapsed) row.classList.add('hidden');
                else if (row.dataset.hidden !== 'true') row.classList.remove('hidden');
            });
        }

        function formatScore(s) {
            return Number.isFinite(s) ? s.toFixed(2) : '—';
        }


        function formatCost(c) {
            if (!Number.isFinite(c)) return '—';
            let color = 'var(--gemini-text-primary)';
            if (c > 5) color = '#E57373';
            else if (c > 1) color = '#FFD54F';
            return `<span style="color: ${color}">$${c.toFixed(2)}</span>`;
        }


        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined || !Number.isFinite(seconds)) return '-';
            if (seconds < 60) return `${seconds.toFixed(0)}s`;
            if (seconds < 3600) return `${(seconds / 60).toFixed(1)}m`;
            if (seconds < 86400) return `${(seconds / 3600).toFixed(1)}h`;
            return `${(seconds / 86400).toFixed(1)}d`;
        }

        function formatStall(g) {
            if (g === null || g === undefined) return '-';
            let color = '#81C784';
            if (g > 50) color = '#E57373';
            else if (g > 10) color = '#FFD54F';
            return `<span style="color: ${color}">${g === 0 ? '✓' : g}</span>`;
        }

        function formatPromptEvo(s) {
            if (!s.has_prompt_evo) return '<span style="opacity:0.2">-</span>';
            return `<span class="chip pe-active" title="Cost: $${s.prompt_evo_cost?.toFixed(4)}">${s.prompt_count}</span>`;

        }

        function formatTimeAgo(ts) {
            if (!Number.isFinite(ts)) return '—';
            return new Date(ts * 1000).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
        }

        function updateCompareButton() {
            document.querySelectorAll('.result-checkbox').forEach(input => {
                if (input.checked) selectedRuns.set(input.dataset.path, { path: input.dataset.path, label: input.dataset.label });
                else selectedRuns.delete(input.dataset.path);
            });
            const count = selectedRuns.size;
            const btn = document.getElementById('compare-btn');
            const badge = document.getElementById('compare-count');
            btn.classList.toggle('visible', count >= 2);
            badge.textContent = count;
            btn.disabled = count < 2;
            const url = new URL(location.href);
            for (const [key, value] of [
                ['selected', selectedRuns.size ? JSON.stringify([...selectedRuns.values()]) : ''],
                ['q', document.getElementById('search-input').value],
                ['sort', document.getElementById('sort-runs').value],
            ]) {
                if (value) url.searchParams.set(key, value);
                else url.searchParams.delete(key);
            }
            history.replaceState(null, '', url);
        }

        function openCompare() {
            const selected = [...selectedRuns.values()];
            window.location.href = '/compare.html?selection=' + encodeURIComponent(JSON.stringify(selected));
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML.replaceAll('"', '&quot;').replaceAll("'", '&#39;');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderTable(e.target.value);
            setTimeout(() => loadVisibleStats(), 100);
        });

        // Auto-refresh
        let autoRefreshId = null;
        let autoRefreshOn = true;

        function startAutoRefresh() {
            if (autoRefreshId) clearInterval(autoRefreshId);
            autoRefreshId = setInterval(loadDatabases, 10000);
        }
        function toggleAutoRefresh() {
            autoRefreshOn = !autoRefreshOn;
            const label = document.getElementById('live-label');
            document.getElementById('live-indicator').setAttribute('aria-pressed', String(autoRefreshOn));
            if (autoRefreshOn) {
                startAutoRefresh();
                label.textContent = '自动刷新：开';
            } else {
                clearInterval(autoRefreshId);
                autoRefreshId = null;
                label.textContent = '自动刷新：关';
            }
        }

        // Initialize
        loadDatabases();
        startAutoRefresh();

        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                document.getElementById('search-input').focus();
            }
        });
    </script>
</body>
</html>
