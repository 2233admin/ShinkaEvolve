<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopBar — preview</title>
<!-- Pinned library builds. Layered so the design system's own bundle.css always wins over their defaults. Without network the page still reads: see the fallback rules at the end of bundle.css. -->
<style>
@import url("https://cdn.jsdelivr.net/npm/@carbon/styles@1.117.0/css/styles.min.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@astrouxds/astro-web-components@8.0.0/dist/astro-web-components/astro-web-components.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/index.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/400.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/500.css") layer(vendor);
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@astrouxds/astro-web-components@8.0.0/dist/astro-web-components/astro-web-components.esm.js"></script>
<style>
.frame { padding: var(--space-5); }
.frame > * + * { margin-top: var(--space-6); }
.cap { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; color: var(--muted); margin: 0 0 var(--space-2); }
</style>
</head>
