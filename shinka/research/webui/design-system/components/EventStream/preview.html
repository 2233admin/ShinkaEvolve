<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventStream — preview</title>
<!-- Pinned library builds. Layered so the design system's own bundle.css always wins over their defaults. Without network the page still reads: see the fallback rules at the end of bundle.css. -->
<style>
@import url("https://cdn.jsdelivr.net/npm/@carbon/styles@1.117.0/css/styles.min.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@astrouxds/astro-web-components@8.0.0/dist/astro-web-components/astro-web-components.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/index.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/400.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/500.css") layer(vendor);
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@astrouxds/astro-web-components@8.0.0/dist/astro-web-components/astro-web-components.esm.js"></script>
<style>
.frame { padding: var(--space-5); }
.frame > * + * { margin-top: var(--space-6); }
.cap { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; color: var(--muted); margin: 0 0 var(--space-2); }
rux-log:defined + .log-fallback { display: none; }
.log-fallback { width: 100%; border-collapse: collapse; font: 13px/1.5 var(--font-sans); }
.log-fallback th, .log-fallback td { text-align: left; padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--line); }
.log-fallback th { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; color: var(--muted); border-bottom-color: var(--line-strong); }
</style>
</head>
<body class="cds--g100">
<div class="frame">
<section>
<p class="cap">时间 · 状态符号 · 假设/实验 · 事件 · 备注；右上角自带过滤框</p>
<h2 class="section-title">事件</h2>
<rux-log id="log"></rux-log>
<table class="log-fallback"><thead><tr><th>Time</th><th></th><th>Event</th></tr></thead><tbody><tr><td class="mono">09:16:00</td><td><rux-status status="standby"></rux-status></td><td>h001/e01 · run · 60 trials</td></tr><tr><td class="mono">09:46:00</td><td><rux-status status="standby"></rux-status></td><td>h001/e02 · run · 20 trials</td></tr><tr><td class="mono">09:52:00</td><td><rux-status status="caution"></rux-status></td><td>h001/e02 · skeptic · evidence ready</td></tr><tr><td class="mono">10:00:00</td><td><rux-status status="normal"></rux-status></td><td>h001/e02 · verdict · supported</td></tr><tr><td class="mono">10:12:00</td><td><rux-status status="critical"></rux-status></td><td>h002/e01 · run-failed · evaluator timeout</td></tr></tbody></table>
</section>
<section>
<p class="cap">没有事件</p>
<h2 class="section-title">事件</h2>
<p class="muted">还没有事件。</p>
</section>
<script>
const data = [{"timestamp": "2026-10-12T09:16:00Z", "status": "standby", "message": "h001/e01 · run · 60 trials"}, {"timestamp": "2026-10-13T09:46:00Z", "status": "standby", "message": "h001/e02 · run · 20 trials"}, {"timestamp": "2026-10-14T09:52:00Z", "status": "caution", "message": "h001/e02 · skeptic · evidence ready"}, {"timestamp": "2026-10-14T10:00:00Z", "status": "normal", "message": "h001/e02 · verdict · supported"}, {"timestamp": "2026-10-15T10:12:00Z", "status": "critical", "message": "h002/e01 · run-failed · evaluator timeout"}].map((e) => ({ ...e, timestamp: new Date(e.timestamp) }));
customElements.whenDefined('rux-log').then(() => { document.getElementById('log').data = data; });
</script></div>
<script>
// Preview only: when the pinned Carbon stylesheet could not load, switch on the offline fallbacks in bundle.css.
const probe = document.body.appendChild(document.createElement('span'));
probe.className = 'cds--visually-hidden';
if (getComputedStyle(probe).position !== 'absolute') document.documentElement.classList.add('no-vendor');
probe.remove();
</script>
</body>
</html>
