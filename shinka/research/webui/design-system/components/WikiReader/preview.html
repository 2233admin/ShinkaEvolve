    <h1 class="display-md" style="margin:0 0 12px">时间序列动量</h1>
    <p>时间序列动量指资产自身过去收益对未来收益的预测力，与横截面动量不同：它不比较资产之间的强弱，只看自己的趋势。经典结果见 <a class="wikilink" href="#">moskowitz-2012</a>。</p>
    <h2>机制与失效条件</h2>
    <blockquote>在趋势反转剧烈、波动骤升的时期，等权持仓的回撤最深；按波动率缩放仓位可以缓解，见 <a class="wikilink" href="#">波动率目标</a>。</blockquote>
