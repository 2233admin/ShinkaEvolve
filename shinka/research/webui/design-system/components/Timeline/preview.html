<!-- Pinned library builds. Layered so the design system's own bundle.css always wins over their defaults. Without network the page still reads: see the fallback rules at the end of bundle.css. -->
<style>
@import url("https://cdn.jsdelivr.net/npm/@carbon/styles@1.117.0/css/styles.min.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@astrouxds/astro-web-components@8.0.0/dist/astro-web-components/astro-web-components.css") layer(vendor);

<style>
.frame { padding: var(--space-5); }
.frame > * + * { margin-top: var(--space-6); }
.cap { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; color: var(--muted); margin: 0 0 var(--space-2); }

<body class="cds--g100">
<div class="frame">

<div class="timeline-wrap"><rux-timeline start="2026-10-12T00:00:00.000Z" end="2026-10-14T00:00:00.000Z" interval="day" zoom="3" timezone="UTC" hide-j-day><rux-track><div slot="label" class="track-label"><span class="mono">h001</span></div><rux-time-region start="2026-10-12T09:16:00.000Z" end="2026-10-13T13:53:00.000Z" status="normal" selected>TS momentum survives costs</rux-time-region></rux-track><rux-track><div slot="label" class="track-label"><span class="mono">h002</span></div><rux-time-region start="2026-10-13T08:00:00.000Z" end="2026-10-13T19:31:00.000Z" status="standby">短期均值回归</rux-time-region></rux-track></rux-timeline></div>
</section>
<section>
<p class="cap">没有试验</p>
