<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Toggle — preview</title></head>
<body>
<div id="root" class="sr-preview">
<div style="display:flex;flex-direction:column;gap:6px">
  <button class="sr-toggle" aria-expanded="false">展开改动</button>
  <button class="sr-toggle" aria-expanded="true">最优程序</button>

</div>
</div>
</body>
</html>
