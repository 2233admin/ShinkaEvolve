<p><span class="sr-term" tabindex="0">N<span class="sr-tip" role="tooltip">N：这个方向里评估过的所有变体（含 probe）。试得越多，门槛越高。</span></span>　<span class="sr-term" tabindex="0">DSR<span class="sr-tip" role="tooltip">DSR：考虑试验次数 N 后，真实 Sharpe 超过噪声门槛的概率。</span></span>　<span class="sr-term" tabindex="0">PBO<span class="sr-tip" role="tooltip">PBO：样本内最优的策略，在样本外排到中位数以下的比例。</span></span>　<span class="sr-term" tabindex="0">噪声门槛<span class="sr-tip" role="tooltip">噪声门槛：N 个纯噪声试验的期望最高分。</span></span>　<span class="sr-term" tabindex="0">验证段<span class="sr-tip" role="tooltip">验证段：agent 看不到的样本外数据，用来出结论。</span></span></p><p style="margin-top:72px">打开状态：<span class="sr-term" tabindex="0">DSR<span class="sr-tip is-open" role="tooltip">DSR：考虑试验次数 N 后，真实 Sharpe 超过噪声门槛的概率。</span></span></p>
