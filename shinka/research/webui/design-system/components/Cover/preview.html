<!-- @dsCard group="Cover" height=360 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover — preview</title>
<style>
@import url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/index.css") layer(vendor);
@import url("https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/400.css") layer(vendor);
</style>
<style>
.cover { box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--space-8); align-items: stretch; min-height: 360px; padding: var(--space-8); background: var(--base); border-bottom: 1px solid var(--line); }
.cover-text { display: flex; flex-direction: column; justify-content: center; gap: var(--space-4); }
.cover h1 { margin: 0; font: 600 28px/1.3 var(--font-sans); color: var(--ink); }
.cover p { margin: 0; max-width: 44ch; font: 13px/1.7 var(--font-sans); color: var(--muted); }
.blocks { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: var(--space-2); }
.b { min-height: var(--space-16); }
.b-raised { background: var(--raised); } .b-selected { background: var(--selected); } .b-strong { background: var(--line-strong); }
.b-accent { background: var(--accent); } .b-ink { background: var(--ink); }
.b-stripes { background: repeating-linear-gradient(90deg, var(--accent) 0 2px, transparent 2px 6px); }
</style>
</head>
<body>
<div class="cover">
<div class="cover-text"><h1>Shinka Research 运维规格台</h1><p>用线和规格表读证据；橙色只留给界线与信号。</p></div>
<div class="blocks" aria-hidden="true"><div class="b b-raised"></div><div class="b b-selected"></div><div class="b b-strong"></div><div class="b b-ink"></div><div class="b b-accent"></div><div class="b b-stripes"></div></div>
</div>
</body>
</html>
