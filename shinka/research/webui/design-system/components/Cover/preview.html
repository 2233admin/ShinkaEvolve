<!-- @dsCard height=320 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shinka Research</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; }
  .deep { fill:var(--ink); }
  .tint { fill:var(--paper-deep); }
  .limit { fill:var(--refuted); }
  .held { fill:var(--supported); }
  .run { fill:var(--running); }
  .blk { rx:var(--radius-none); }
  .hair { stroke:var(--rule-strong); stroke-width:1; }
  .hair-on-ink { stroke:var(--ink-muted); stroke-width:1; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:96px; line-height:.95; font-weight:600; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      ink 160×288 slab bleeding off the top (the notebook's ink, largest) · paper-deep 200×200 tint (the chart band) · refuted 120×96 (every limit: seal, noise bar) · supported 40×48 and running 40×20 small satellites (status inks are sparse) — ≈42% of 960×320
  arrangement one tall ink slab with satellites, bottoms on one line space-8 above the edge, space-5 gutters, tint bleeding off the right edge
  pattern     a few hairline rules, from "Flat paper … hierarchy is rules, whitespace and type": four rule-strong hairlines at a space-12 pitch crossing tint and limit, continuing across the slab in ink-muted
  scales      sides in space-1 multiples; gutters space-5; rule pitch space-12; every corner radius-none
-->
<rect class="deep blk" x="20" y="-20" width="160" height="308"/>
<rect class="tint blk" x="200" y="88" width="300" height="200"/>
<rect class="limit blk" x="200" y="192" width="120" height="96"/>
<rect class="held blk" x="340" y="240" width="40" height="48"/>
<rect class="run blk" x="400" y="268" width="40" height="20"/>
<line class="hair-on-ink" x1="20" x2="180" y1="112" y2="112"/>
<line class="hair-on-ink" x1="20" x2="180" y1="160" y2="160"/>
<line class="hair-on-ink" x1="20" x2="180" y1="208" y2="208"/>
<line class="hair" x1="180" x2="480" y1="112" y2="112"/>
<line class="hair" x1="180" x2="480" y1="160" y2="160"/>
<line class="hair" x1="320" x2="480" y1="208" y2="208"/>
</svg>
</div>
<div class="words">
<h1 class="name">Shinka<br>Research</h1>
<p class="tag">研究记录本：假设、证据与门槛。</p>
</div>
</div>
</body>
</html>
